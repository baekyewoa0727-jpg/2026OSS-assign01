<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백예원 · 자기소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F0F3;
    --ink:#24291F;
    --ink-soft:rgba(36,41,31,0.72);
    --rust:#A64B2A;
    --forest:#445E43;
    --gold:#B8862F;
    --rail:#C7C0AC;
  }

  *{box-sizing:border-box;}

  html{-webkit-font-smoothing:antialiased;}

  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,41,31,0.06) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    line-height:1.6;
  }

  .page{
    max-width:640px;
    margin:0 auto;
    padding:88px 28px 64px;
  }

  /* header */

  .hash{
    font-family:'Gowun Dodum', sans-serif;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--forest);
    margin:0 0 18px;
  }
  .hash::before{content:"# ";color:var(--rail);}

  h1.name{
    font-family:'Jua', sans-serif;
    font-weight:400;
    font-size:clamp(40px, 8vw, 62px);
    margin:0 0 6px;
    line-height:1.15;
  }

  .nickname{
    font-family:'Gowun Dodum', sans-serif;
    font-weight:400;
    color:var(--rust);
    font-size:18px;
    margin:0 0 30px;
  }

  .config{
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    border-left:2px solid var(--rail);
    padding-left:18px;
    margin:0 0 56px;
  }
  .config div{margin:4px 0;}
  .config .key{color:var(--forest); font-weight:700;}
  .config .key::after{content:": ";color:var(--ink-soft); font-weight:400;}

  /* git graph timeline */

  .log{
    position:relative;
    padding-left:34px;
  }

  .log::before{
    content:"";
    position:absolute;
    left:9px;
    top:8px;
    bottom:8px;
    width:1.5px;
    background:var(--rail);
    transform-origin:top;
    transform:scaleY(0);
    animation:draw 1.1s 0.15s cubic-bezier(.5,0,.2,1) forwards;
  }

  .commit{
    position:relative;
    margin-bottom:52px;
    opacity:0;
    animation:rise 0.6s ease-out forwards;
  }
  .commit:nth-of-type(1){animation-delay:0.35s;}
  .commit:nth-of-type(2){animation-delay:0.75s;}
  .commit:nth-of-type(3){animation-delay:1.15s;}
  .commit:last-child{margin-bottom:0;}

  .commit::before{
    content:"";
    position:absolute;
    left:-34px;
    top:6px;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--paper);
    border:2.5px solid var(--rust);
  }

  .commit-msg{
    font-family:'Gowun Dodum', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--rust);
    margin:0 0 8px;
  }

  .commit h2{
    font-family:'Jua', sans-serif;
    font-weight:400;
    font-size:23px;
    margin:0 0 10px;
  }

  .commit h2 + h2{
    margin-top:-4px;
  }

  .commit p{
    margin:0;
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:52ch;
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .tag{
    font-family:'Gowun Dodum', sans-serif;
    font-size:12px;
    color:var(--forest);
    border:1px solid var(--rail);
    border-radius:999px;
    padding:4px 12px;
    background:rgba(68,94,67,0.05);
  }

  .goal-list{
    margin:0;
    padding-left:20px;
    color:var(--ink-soft);
    font-size:15.5px;
  }
  .goal-list li{margin:4px 0;}
  .goal-list li::marker{color:var(--gold);}

  /* footer */

  .foot{
    margin-top:72px;
    padding-top:22px;
    border-top:1px solid var(--rail);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'Gowun Dodum', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .foot .branch::before{content:"⎇ ";color:var(--forest);}

  @keyframes draw{to{transform:scaleY(1);}}
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .log::before, .commit{animation:none; opacity:1; transform:none;}
  }

  @media (max-width:480px){
    .page{padding:56px 20px 48px;}
    .foot{flex-direction:column; gap:6px; align-items:flex-start;}
  }
</style>
</head>
<body>
  <div class="page">

    <p class="hash"></p>
    <h1 class="name">백예원</h1>

    <div class="config">
      <div><span class="key">name</span>백예원 tato</div>
      <div><span class="key">id</span>24학번</div>
      <div><span class="key">major</span>전산심화</div>
    </div>

    <div class="log">

      <div class="commit">
        <p class="commit-msg">관심 분야 및 취미</p>
        <h2>음악 듣기, 운동</h2>
        <div class="tags">
          <span class="tag">music</span>
          <span class="tag">workout</span>
        </div>
      </div>

      <div class="commit">
        <p class="commit-msg">26-2학기 OSS 수업 목표</p>
        <h2>웹 페이지 제작 및 관리</h2>
        <h2>git 사용법 익히기</h2>
        <div class="tags">
          <span class="tag">Web Development</span>
          <span class="tag">git</span>
        </div>
      </div>

      <div class="commit">
        <p class="commit-msg">만들어보고 싶은 프로젝트</p>
        <h2>회원가입 · 로그인 기능</h2>
        <ul class="goal-list">
          <li>회원가입 / 로그인 기능이 있는 웹사이트 직접 제작 및 관리</li>
        </ul>
      </div>

    </div>

    <div class="foot">
      <span>2026 · 2학기 · 4학기</span>
    </div>

  </div>
</body>
</html>
